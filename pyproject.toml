[project]
name = "quant-analysis"
version = "0.1.0"
description = "Regression Model Quantization Analysis Toolkit"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  {name = "Gil Benezer", email = "benezer.gi@northeastern.edu"},
  {name = "Brent Garey", email = "garey.b@northeastern.edu"}
]
dependencies = [
    "datasets>=4.6.1",
    "jupyter>=1.1.1",
    "lightning>=2.6.1",
    "mslk-cuda>=1.0.0",
    "onnx>=1.20.1",
    "onnxruntime>=1.24.1",
    "onnxruntime-gpu>=1.24.1",
    "onnxscript>=0.6.0",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "ramanspy>=0.2.10",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "torch>=2.10.0",
    "torchao>=0.15.0",
    "torchvision>=0.25.0",
    "transformers>=5.3.0",
    "ucimlrepo>=0.0.7",
]

[project.urls]
Homepage = "https://github.com/gbenezer/Quant_Analysis"
Repository = "https://github.com/gbenezer/Quant_Analysis.git"

[build-system]
requires = ["setuptools>=80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["quant_analysis"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "isort>=7.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.0",
]
